<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Clinic Desk</title>
<style>
:root{--bg:#f4f1ea;--ink:#1c1b18;--mute:#7a766b;--line:#dcd7ca;--card:#fbfaf6;--acc:#0f6b57;--hot:#e0572f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 ui-sans-serif,"Inter",system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;border-bottom:1px solid var(--line)}
h1{font:600 20px Georgia,serif;margin:0}h2{font:600 12px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);margin:0 0 12px}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:10px 20px;background:var(--ink);color:#fff}
main{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;padding:28px;max-width:1200px;margin:auto}
.doc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.doc b{display:block}small{color:var(--mute)}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:6px;padding:3px 7px}
table{width:100%;border-collapse:collapse}td{padding:10px 8px;border-bottom:1px solid var(--line)}
tr.hl{animation:hl 2.4s}@keyframes hl{0%{background:#f6c9b8}100%{background:transparent}}.empty{color:var(--mute)}
#phone{position:fixed;right:24px;bottom:24px;width:340px;height:620px;max-height:calc(100vh - 48px);background:#14221e;color:#eaf3ef;border-radius:36px;padding:22px;display:flex;flex-direction:column;box-shadow:0 30px 80px #0006;transform:translateY(120%) scale(.96);opacity:0;pointer-events:none;transition:.45s cubic-bezier(.2,.9,.3,1);z-index:9}
#phone.on{transform:none;opacity:1;pointer-events:auto}#who{font:600 20px Georgia,serif;text-align:center;margin-top:6px}
#st{text-align:center;color:#9bb8ad;font-size:13px}canvas{width:100%;height:56px;margin:10px 0}
#tr{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;font-size:13px}
.m{padding:8px 12px;border-radius:14px;max-width:85%}.m.agent{background:#223a33}.m.user{background:#eaf3ef;color:#14221e;align-self:flex-end}
#card{display:none;background:#fff;color:var(--ink);border-radius:14px;padding:12px;margin:8px 0;font-size:13px;border-left:4px solid var(--acc)}
#card.x{border-color:var(--hot)}.btns{display:flex;gap:12px;justify-content:center;margin-top:12px}
.btns button{width:52px;height:52px;padding:0;background:#223a33;color:#fff}.btns #end{background:var(--hot)}.btns button.mu{background:#eaf3ef;color:#14221e}
@media(max-width:820px){main{grid-template-columns:1fr;padding:16px}#phone{inset:0;width:auto;height:auto;max-height:none;border-radius:0}}
</style></head><body>
<header><h1>Clinic Desk</h1><button id="try">Try call</button></header>
<main><section><h2>Doctors</h2><div id="docs"></div></section><section><h2>Appointments</h2><table id="ap"></table></section></main>
<aside id="phone"><div id="who">Aria · Clinic</div><div id="st"></div><canvas id="cv"></canvas>
<div id="tr"></div><div id="card"></div>
<div class="btns"><button id="mute" title="Mute">🎙</button><button id="end" title="End">✕</button></div></aside>
<audio id="au" autoplay></audio>
<script>
const $=s=>document.querySelector(s),fmt=(d,t)=>new Date(d+'T'+t).toLocaleString([],{weekday:'short',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
let pc,stream,tick,t0,ac,raf,ringT,key='';
async function load(){const [d,a]=await Promise.all([fetch('/api/doctors').then(r=>r.json()),fetch('/api/appointments').then(r=>r.json())]);
$('#docs').innerHTML=d.map(x=>`<div class=doc><b>${x.name}</b><small>${x.speciality}</small><div class=chips>${x.slots.map(s=>`<span class=chip>${fmt(s.date,s.time)}</span>`).join('')||'<span class=empty>Fully booked</span>'}</div></div>`).join('');
$('#ap').innerHTML=a.length?a.map(x=>`<tr data-k="${x.phone}"><td><b>${x.patient||'—'}</b><br><small>${x.phone}</small></td><td>${x.doctor}</td><td>${fmt(x.date,x.time)}</td></tr>`).join(''):'<tr><td class=empty>No appointments yet</td></tr>';
if(key)document.querySelector(`tr[data-k="${key}"]`)?.classList.add('hl');key='';}
const es=new EventSource('/api/events');es.onmessage=async e=>{const v=JSON.parse(e.data);
if(v.type=='transcript'){const m=document.createElement('div');m.className='m '+v.role;m.textContent=v.text;$('#tr').append(m);$('#tr').scrollTop=1e9}
else{const a=v.appointment,b=v.type=='booked',c=$('#card');key=b?a.phone:'';c.className=b?'':'x';c.style.display='block';
c.innerHTML=`<b>${b?'Booked':'Cancelled'}</b><br>${a.doctor} · ${fmt(a.date,a.time)}`;await load()}};
function beep(f,d){ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}
function wave(s){const an=ac.createAnalyser();an.fftSize=64;ac.createMediaStreamSource(s).connect(an);const cv=$('#cv'),x=cv.getContext('2d'),b=new Uint8Array(32);cv.width=300;cv.height=56;
(function d(){raf=requestAnimationFrame(d);an.getByteFrequencyData(b);x.clearRect(0,0,300,56);x.fillStyle='#5fd0b0';b.forEach((v,i)=>{const h=Math.max(3,v/255*52);x.fillRect(i*9.4+2,28-h/2,5,h)})})()}
$('#try').onclick=async()=>{if(pc)return;$('#phone').classList.add('on');$('#tr').innerHTML='';$('#card').style.display='none';$('#st').textContent='Calling…';
ac=ac||new AudioContext();beep(440,.4);ringT=setInterval(()=>beep(440,.4),1800);
try{stream=await navigator.mediaDevices.getUserMedia({audio:true});
pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});stream.getTracks().forEach(t=>pc.addTrack(t,stream));
pc.ontrack=e=>{$('#au').srcObject=e.streams[0];wave(e.streams[0]);clearInterval(ringT);t0=Date.now();
tick=setInterval(()=>{const s=(Date.now()-t0)/1e3|0;$('#st').textContent='Connected · '+String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},500)};
pc.onconnectionstatechange=()=>['failed','closed'].includes(pc.connectionState)&&end();
await pc.setLocalDescription(await pc.createOffer());
await new Promise(r=>{if(pc.iceGatheringState=='complete')return r();pc.onicegatheringstatechange=()=>pc.iceGatheringState=='complete'&&r()});
const l=pc.localDescription,a=await fetch('/api/offer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sdp:l.sdp,type:l.type})}).then(r=>r.json());
await pc.setRemoteDescription(a)}catch(e){$('#st').textContent='Could not connect';setTimeout(end,1500)}};
function end(){if(!pc&&!stream)return;clearInterval(ringT);clearInterval(tick);cancelAnimationFrame(raf);
const p=pc;pc=null;p&&p.close();stream&&stream.getTracks().forEach(t=>t.stop());stream=null;$('#st').textContent='Call ended';beep(300,.3);
setTimeout(()=>$('#phone').classList.remove('on'),1200)}
$('#end').onclick=end;$('#mute').onclick=e=>{const t=stream?.getAudioTracks()[0];if(!t)return;t.enabled=!t.enabled;e.currentTarget.classList.toggle('mu',!t.enabled)};
load();
</script></body></html>
